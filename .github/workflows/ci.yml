name: CI

###############################################################################
# Continuous Integration
#
# Purpose:
#   Validate the Cloud Cost Intelligence Platform before production deployment.
#
# Pipeline:
#
#   Code Quality ───────────────┐
#   Security Scanning ──────────┤
#   Terraform Validation ──────┤
#   Shell Validation ──────────┤
#                                ▼
#                         Build Verification
#                         ├── Docker image
#                         └── Lambda packages
#
# CD is intentionally NOT handled here.
# Production deployment is triggered by the separate CD workflow.
###############################################################################

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.7.5"
  AWS_REGION: "eu-west-1"

defaults:
  run:
    shell: bash

jobs:

###############################################################################
# CODE QUALITY
###############################################################################

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Quality Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            black==24.10.0 \
            flake8 \
            bandit \
            safety

      # -----------------------------------------------------------------------
      # Python formatting
      # -----------------------------------------------------------------------

      - name: Black Format Check
        run: |
          black --check \
            api \
            lambdas

      # -----------------------------------------------------------------------
      # Python linting
      # -----------------------------------------------------------------------

      - name: Flake8
        run: |
          flake8 api lambdas 

      # -----------------------------------------------------------------------
      # Security-oriented Python static analysis
      # -----------------------------------------------------------------------

      - name: Bandit
        run: |
          bandit \
            -r api lambdas \
            -ll \
            -x "*/package/*,*/__pycache__/*" \
            || true

      # -----------------------------------------------------------------------
      # Dependency vulnerability checks
      # -----------------------------------------------------------------------

      - name: Safety Dependency Scan
        run: |
          set +e

          echo "Scanning API dependencies..."
          safety check -r api/requirements.txt

          for req in lambdas/*/requirements.txt; do
            echo ""
            echo "Scanning $req..."
            safety check -r "$req"
          done

          # Safety is currently treated as a warning gate because
          # dependency databases can report vulnerabilities without
          # immediately providing a compatible upgrade.
          exit 0

      # -----------------------------------------------------------------------
      # Dockerfile validation
      # -----------------------------------------------------------------------

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile
          failure-threshold: warning


###############################################################################
# TERRAFORM VALIDATION
###############################################################################

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt \
            -check \
            -recursive

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend=false \
            -input=false

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate

      # -----------------------------------------------------------------------
      # TFLint
      # -----------------------------------------------------------------------

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Checkov
      # -----------------------------------------------------------------------

      - name: Terraform Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          soft_fail: true


###############################################################################
# SHELL SCRIPT VALIDATION
###############################################################################

  shellcheck:
    name: Shell Script Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts


###############################################################################
# REPOSITORY SECURITY SCAN
###############################################################################

  security:
    name: Repository Security Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"


###############################################################################
# DOCKER BUILD VERIFICATION
###############################################################################

  build:
    name: Build API Container
    runs-on: ubuntu-latest

    needs:
      - quality
      - terraform
      - security

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: false
          tags: cloud-cost-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


###############################################################################
# LAMBDA PACKAGE BUILD
###############################################################################

  build-functions:
    name: Build Lambda Packages
    runs-on: ubuntu-latest

    needs:
      - quality
      - security

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Lambda Packages
        run: |
          bash scripts/build-functions.sh

      # -----------------------------------------------------------------------
      # Verify packages actually contain the Lambda handlers
      # -----------------------------------------------------------------------

      - name: Verify Lambda Packages
        run: |
          set -e

          for zip in build/*.zip; do
            echo ""
            echo "Checking $zip"

            unzip -l "$zip" | grep -q "app.py" || {
              echo "ERROR: $zip does not contain app.py"
              exit 1
            }
          done

      # -----------------------------------------------------------------------
      # Publish packages as CI artifacts
      # -----------------------------------------------------------------------

      - name: Upload Lambda Packages
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages-${{ github.sha }}
          path: build/*.zip
          if-no-files-found: error
          retention-days: 7


###############################################################################
# CI SUMMARY
###############################################################################

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest

    needs:
      - quality
      - terraform
      - shellcheck
      - security
      - build
      - build-functions

    if: always()

    steps:

      - name: Evaluate CI
        run: |
          echo "Quality:       ${{ needs.quality.result }}"
          echo "Terraform:     ${{ needs.terraform.result }}"
          echo "ShellCheck:    ${{ needs.shellcheck.result }}"
          echo "Security:      ${{ needs.security.result }}"
          echo "Docker Build:  ${{ needs.build.result }}"
          echo "Lambda Build:  ${{ needs.build-functions.result }}"

          if [[ \
            "${{ needs.quality.result }}" != "success" ||
            "${{ needs.terraform.result }}" != "success" ||
            "${{ needs.shellcheck.result }}" != "success" ||
            "${{ needs.security.result }}" != "success" ||
            "${{ needs.build.result }}" != "success" ||
            "${{ needs.build-functions.result }}" != "success"
          ]]; then
            echo "❌ CI validation failed."
            exit 1
          fi

          echo "✅ All CI gates passed."
